plugins {
    id 'idea'
    id 'eclipse'
    id 'java-library'
    id 'distribution'
    id 'signing'
    id 'com.vanniktech.maven.publish' version '0.37.0'
    id 'org.ajoberstar.git-publish' version '3.0.1' // javadocs -> gh-pages // 4.x requires Java 11
}

group = 'io.github.denysobukh'
version = '1.1.1'
description = 'Maintained fork of the EMC NFS client with security fixes.'

// name of the github project repository
ext.githubProjectName = 'nfs-client'
// URL to github project
ext.githubProjectUrl = "https://github.com/denysobukh/${githubProjectName}"
// git remote scm address
ext.githubScmUrl = "scm:git:https://github.com/denysobukh/${githubProjectName}.git"
ext.githubDeveloperScmUrl = "scm:git:ssh://git@github.com/denysobukh/${githubProjectName}.git"
// git remote https address
ext.githubRemoteUrl = "https://github.com/denysobukh/${githubProjectName}.git"
// license info
ext.licenseName = 'Apache License, Version 2.0'
ext.licenseUrl = 'https://www.apache.org/licenses/LICENSE-2.0'

// Maven Central Portal token credentials: mavenCentralUsername and mavenCentralPassword.
// Configure GPG through signing.gnupg.* properties; keep credentials outside this repository.

// NOTE: git repo credentials should be configured with the following properties:
// gitUsername
// gitPassword
System.setProperty('org.ajoberstar.grgit.auth.username', findProperty('gitUsername') ?: '')
System.setProperty('org.ajoberstar.grgit.auth.password', findProperty('gitPassword') ?: '')

defaultTasks 'distZip'

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation "io.netty:netty-transport:4.2.16.Final"
    implementation "io.netty:netty-codec-base:4.2.16.Final"
    implementation "org.apache.commons:commons-lang3:3.18.0"
    implementation "org.slf4j:slf4j-api:1.7.36"

    testImplementation "junit:junit:4.13.2"

    testRuntimeOnly "org.slf4j:slf4j-simple:1.7.36"
}

allprojects {
    configurations {
        tools // specifies tool artifacts for the distribution (placed in the tools/ directory)
    }
    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        }
        tasks.withType(JavaCompile).configureEach {
            options.release = 17
        }
    }
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
    options.deprecation = true
}

jar {
    doFirst {
        manifest {
            attributes 'Implementation-Version': project.version,
                    'Class-Path': configurations.runtimeClasspath.collect { it.getName() }.join(' ')
        }
    }
    into("META-INF/maven/$project.group/$project.name") {
        from { generatePomFileForMavenPublication }
        rename "pom-default.xml", "pom.xml"
    }
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

distributions {
    main {
        contents {
            from jar
            into('tools') {
                from { allprojects.configurations.tools.artifacts.files }
            }
            from('.') {
                include '*.txt'
            }
            into('3rd-party-licenses') {
                from '3rd-party-licenses'
            }
            into('lib') {
                from configurations.runtimeClasspath
            }
        }
    }
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
    coordinates('io.github.denysobukh', 'nfs-client', '1.1.1')

    pom {
        name = 'NFS Client'
        description = project.description
        url = githubProjectUrl

        scm {
            url = githubProjectUrl
            connection = githubScmUrl
            developerConnection = githubDeveloperScmUrl
        }

        licenses {
            license {
                name = licenseName
                url = licenseUrl
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'denysobukh'
                name = 'Denys Obukhov'
                url = 'https://github.com/denysobukh'
            }
        }
    }
}

signing {
    useGpgCmd()
}

ext.aggregatedDocsDir = "$buildDir/aggregatedDocs"
tasks.register('aggregateDocs') {
    doLast {
        if (project.hasProperty('release.stage') && project.ext['release.stage'] == 'final') {
            copy {
                from layout.buildDirectory.dir('docs/javadoc')
                into "${aggregatedDocsDir}/latest"
            }
            subprojects.each { p ->
                copy {
                    from p.layout.buildDirectory.dir('docs/javadoc')
                    into "${aggregatedDocsDir}/latest/${p.name}"
                }
            }
        }
        copy {
            from layout.buildDirectory.dir('docs/javadoc')
            into "${aggregatedDocsDir}/${project.version}"
        }
        subprojects.each { p ->
            copy {
                from p.layout.buildDirectory.dir('docs/javadoc')
                into "${aggregatedDocsDir}/${project.version}/${p.name}"
            }
        }
    }
}
tasks.aggregateDocs.dependsOn javadoc
aggregateDocs.dependsOn { subprojects.collect { it.tasks['javadoc'] } }

gitPublish {
    repoUri = githubRemoteUrl
    branch = 'gh-pages'
    contents {
        from aggregatedDocsDir
    }
    preserve { include '**/*' }
}
tasks.gitPublishPush.dependsOn aggregateDocs


clean {
    delete aggregatedDocsDir
}