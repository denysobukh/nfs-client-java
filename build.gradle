plugins {
    id 'idea'
    id 'eclipse'
    id 'java-library'
    id 'jacoco'
    id 'distribution'
    id 'signing'
    id 'com.diffplug.spotless' version '8.11.0'
    id 'net.ltgt.errorprone' version '5.2.0'
    id 'com.github.spotbugs' version '6.5.13'
    id 'org.cyclonedx.bom' version '3.5.1'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'io.github.denysobukh'
version = '1.1.3'
description = 'Maintained fork of the EMC NFS client with security fixes.'

// name of the github project repository
ext.githubProjectName = 'nfs-client-java'
// URL to github project
ext.githubProjectUrl = "https://github.com/denysobukh/${githubProjectName}"
// git remote scm address
ext.githubScmUrl = "scm:git:https://github.com/denysobukh/${githubProjectName}.git"
ext.githubDeveloperScmUrl = "scm:git:ssh://git@github.com/denysobukh/${githubProjectName}.git"
// license info
ext.licenseName = 'Apache License, Version 2.0'
ext.licenseUrl = 'https://www.apache.org/licenses/LICENSE-2.0'

// Maven Central Portal token credentials: mavenCentralUsername and mavenCentralPassword.
// Configure GPG through signing.gnupg.* properties; keep credentials outside this repository.

defaultTasks 'distZip'

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation "io.netty:netty-transport:4.2.16.Final"
    implementation "io.netty:netty-codec-base:4.2.16.Final"
    implementation "org.apache.commons:commons-lang3:3.18.0"
    implementation "org.slf4j:slf4j-api:1.7.36"

    testImplementation "junit:junit:4.13.2"

    testRuntimeOnly "org.slf4j:slf4j-simple:1.7.36"
}

allprojects {
    apply plugin: 'com.diffplug.spotless'

    spotless {
        java {
            googleJavaFormat('2.0.0')
        }
    }

    tasks.named('cyclonedxDirectBom') {
        includeConfigs = ['runtimeClasspath', 'testRuntimeClasspath', 'demoRuntimeClasspath']
        xmlOutput.convention((org.gradle.api.file.RegularFile) null)
    }
    configurations {
        tools // specifies tool artifacts for the distribution (placed in the tools/ directory)
    }
    plugins.withId('java') {
        apply plugin: 'jacoco'
        apply plugin: 'net.ltgt.errorprone'
        apply plugin: 'com.github.spotbugs'

        jacoco {
            toolVersion = '0.8.15'
        }
        tasks.named('test') {
            finalizedBy tasks.named('jacocoTestReport')
        }
        tasks.named('jacocoTestReport') {
            dependsOn tasks.named('test')
            reports {
                xml.required = true
                html.required = true
            }
        }

        spotbugs {
            toolVersion = '4.10.5'
            effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
            reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW')
            excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
        }
        tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
            reports {
                xml.required = true
                html.required = true
            }
        }
        sourceSets.configureEach { sourceSet ->
            tasks.named(sourceSet.getTaskName('spotbugs', null)) {
                // Shared test fixtures also reference implementation dependencies from the client.
                auxClassPaths.from(sourceSet.runtimeClasspath)
            }
        }

        dependencies {
            errorprone 'com.google.errorprone:error_prone_core:2.52.0'
        }

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        }
        tasks.withType(JavaCompile).configureEach {
            options.release = 17
        }
    }
}

java {
    withSourcesJar()
}

tasks.named('cyclonedxBom') {
    xmlOutput.convention((org.gradle.api.file.RegularFile) null)
}

// Small executable example that exercises this checkout against a real NFSv3 server.
sourceSets {
    demo {
        java.srcDir 'examples/nfs-demo/src/main/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    demoImplementation.extendsFrom implementation
    demoRuntimeOnly.extendsFrom runtimeOnly
}
dependencies {
    demoRuntimeOnly 'org.slf4j:slf4j-simple:1.7.36'
}
tasks.register('nfsDemo', JavaExec) {
    description = 'Run basic NFS operations against the Docker demo server.'
    group = 'verification'
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'example.NfsDemo'
    args providers.gradleProperty('nfsServer').getOrElse('127.0.0.1'),
            providers.gradleProperty('nfsExport').getOrElse('/export')
}
tasks.register('stageNfsDemo', Sync) {
    description = 'Stage the demo classes and dependencies for its Docker image.'
    dependsOn tasks.named('demoClasses')
    into layout.buildDirectory.dir('nfs-demo')
    into('classes') {
        from sourceSets.main.output
        from sourceSets.demo.output
    }
    into('lib') {
        from configurations.demoRuntimeClasspath
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
    options.deprecation = true
}

jar {
    def implementationVersion = project.version.toString()
    def runtimeFiles = configurations.runtimeClasspath
    inputs.property('implementationVersion', implementationVersion)
    inputs.files(runtimeFiles).withPropertyName('manifestClasspath')
    doFirst {
        manifest {
            attributes 'Implementation-Version': implementationVersion,
                    'Class-Path': runtimeFiles.collect { it.getName() }.join(' ')
        }
    }
    into("META-INF/maven/$project.group/$project.name") {
        from { generatePomFileForMavenPublication }
        rename "pom-default.xml", "pom.xml"
    }
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

distributions {
    main {
        contents {
            from jar
            into('tools') {
                from { allprojects.configurations.tools.artifacts.files }
            }
            from('.') {
                include '*.txt'
            }
            into('3rd-party-licenses') {
                from '3rd-party-licenses'
            }
            into('lib') {
                from configurations.runtimeClasspath
            }
        }
    }
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
    coordinates('io.github.denysobukh', 'nfs-client', '1.1.3')

    pom {
        name = 'NFS Client'
        description = project.description
        url = githubProjectUrl

        scm {
            url = githubProjectUrl
            connection = githubScmUrl
            developerConnection = githubDeveloperScmUrl
        }

        licenses {
            license {
                name = licenseName
                url = licenseUrl
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'denysobukh'
                name = 'Denys Obukhov'
                url = 'https://github.com/denysobukh'
            }
        }
    }
}

signing {
    useGpgCmd()
}

// Merge all test executions, including tool tests that exercise client classes.
tasks.register('jacocoAggregateReport', JacocoReport) {
    description = 'Generate combined coverage for the client and both tool modules.'
    group = 'verification'
    dependsOn allprojects.collect { it.tasks.named('test') }
    sourceDirectories.from(provider { allprojects.collect { it.sourceSets.main.allJava.srcDirs } })
    classDirectories.from(provider { allprojects.collect { it.sourceSets.main.output.classesDirs } })
    executionData.from(allprojects.collect {
        fileTree(it.layout.buildDirectory) { include 'jacoco/test.exec' }
    })
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/aggregate/coverage.xml')
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/aggregate/html')
    }
}

tasks.register('jacocoAggregateCoverageVerification', JacocoCoverageVerification) {
    description = 'Require at least 80% combined line coverage across all modules.'
    group = 'verification'
    def aggregate = tasks.named('jacocoAggregateReport')
    dependsOn aggregate
    sourceDirectories.from(aggregate.map { it.sourceDirectories })
    classDirectories.from(aggregate.map { it.classDirectories })
    executionData.from(aggregate.map { it.executionData })
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoAggregateCoverageVerification')
}

// Build the static site deployed by the GitHub Pages workflow.
tasks.register('aggregateDocs', Sync) {
    description = 'Stage Javadocs and test coverage for GitHub Pages.'
    group = 'documentation'
    into layout.buildDirectory.dir('aggregatedDocs')
    from('src/docs')
    into('coverage') {
        from tasks.named('jacocoAggregateReport').map { it.reports.html.outputLocation }
    }
    into('latest/javadoc') {
        from tasks.named('javadoc')
    }
    into("${project.version}/javadoc") {
        from tasks.named('javadoc')
    }
    subprojects.each { p ->
        into("latest/${p.name}/javadoc") {
            from { p.tasks.named('javadoc').get() }
        }
        into("${project.version}/${p.name}/javadoc") {
            from { p.tasks.named('javadoc').get() }
        }
    }
}
